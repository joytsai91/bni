<script>
  /* 會員名冊：搜尋與篩選、會籍到期標示、新增與編輯、軟刪除、個人邀請連結 */
  (function () {
    'use strict';
    var App = window.App;
    var esc = App.esc;

    var STATUSES = ['在籍', '休會', '離會'];
    var POSITIONS = ['主席', '副主席', '秘書財務', '會員委員會', '來賓接待', '教育協調', '活動協調', '導師協調'];

    function daysBetween(from, to) {
      return Math.round((Date.parse(to + 'T00:00:00Z') - Date.parse(from + 'T00:00:00Z')) / 86400000);
    }

    /** 會籍到期標籤：在籍會員到期前 N 天開始提醒 */
    function expiryTag(m, today, noticeDays) {
      if (!m.active || !m.expiryDate) return '';
      var left = daysBetween(today, m.expiryDate);
      if (left < 0) return '<span class="tag red">已過期 ' + (-left) + ' 天</span>';
      if (left <= noticeDays) return '<span class="tag red">' + (left === 0 ? '今天到期' : left + ' 天後到期') + '</span>';
      return '';
    }

    function isExpiring(m, today, noticeDays) {
      return m.active && !!m.expiryDate && daysBetween(today, m.expiryDate) <= noticeDays;
    }

    function memberRow(m, today, noticeDays) {
      var sub = [m.company, m.category].filter(Boolean).join('・');
      var meta = [m.phone, m.industryGroup ? '產業群組：' + m.industryGroup : '', m.joinDate ? '入會 ' + m.joinDate : '',
        m.expiryDate ? '到期 ' + m.expiryDate : ''].filter(Boolean).join('・');
      return '<button type="button" class="ev-row" data-id="' + esc(m.id) + '"><div class="ev-main">' +
        '<div class="ev-name">' + esc(m.name) + (m.position ? '<span class="tag">' + esc(m.position) + '</span>' : '') +
        (m.status !== '在籍' ? '<span class="tag gray">' + esc(m.status) + '</span>' : '') + expiryTag(m, today, noticeDays) + '</div>' +
        '<div class="ev-meta">' + esc(sub || '　') + '</div>' + (meta ? '<div class="ev-counts">' + esc(meta) + '</div>' : '') + '</div></button>';
    }

    function datalist(id, values) {
      return '<datalist id="' + id + '">' + values.map(function (v) { return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>';
    }

    function memberForm(m, groups) {
      var form = document.createElement('form');
      form.className = 'form-grid';
      var status = m.status || '在籍';
      var statuses = STATUSES.indexOf(status) >= 0 ? STATUSES : STATUSES.concat([status]);
      form.innerHTML =
        App.field('姓名', '<input type="text" name="name" maxlength="40" value="' + esc(m.name || '') + '">', true) +
        App.field('公司', '<input type="text" name="company" maxlength="80" value="' + esc(m.company || '') + '">') +
        App.field('專業別', '<input type="text" name="category" maxlength="60" value="' + esc(m.category || '') + '">') +
        App.field('產業群組', '<input type="text" name="industryGroup" maxlength="30" list="mb-groups" value="' + esc(m.industryGroup || '') + '">' + datalist('mb-groups', groups)) +
        App.field('分會職務', '<input type="text" name="position" maxlength="30" list="mb-positions" value="' + esc(m.position || '') + '">' + datalist('mb-positions', POSITIONS)) +
        App.field('手機', '<input type="tel" name="phone" maxlength="30" value="' + esc(m.phone || '') + '">') +
        App.field('Email', '<input type="email" name="email" maxlength="100" value="' + esc(m.email || '') + '">') +
        App.field('LINE ID', '<input type="text" name="lineId" maxlength="50" value="' + esc(m.lineId || '') + '">') +
        App.field('入會日', '<input type="date" name="joinDate" value="' + esc(m.joinDate || '') + '">') +
        App.field('會籍到期日', '<input type="date" name="expiryDate" value="' + esc(m.expiryDate || '') + '">') +
        App.field('引薦人', '<input type="text" name="sponsor" maxlength="40" value="' + esc(m.sponsor || '') + '">') +
        App.field('狀態', '<select name="status">' + statuses.map(function (s) {
          return '<option' + (s === status ? ' selected' : '') + '>' + esc(s) + '</option>';
        }).join('') + '</select>', false, '休會、離會的會員不會出現在簽到與列印') +
        App.field('備註', '<textarea name="note" rows="2" maxlength="300">' + esc(m.note || '') + '</textarea>', false, '', 'full') +
        '<button type="submit" hidden></button>';
      return form;
    }

    function inviteUrl(m) {
      return App.session.registerUrl ? App.session.registerUrl + '&inviter=' + encodeURIComponent(m.name) : '';
    }

    /** 個人邀請連結：來賓從這個連結報名，邀請人自動帶入這位會員 */
    function showInvite(m) {
      var url = inviteUrl(m);
      var body = document.createElement('div');
      body.className = 'stack';
      body.innerHTML = '<p class="muted" style="margin:0">把連結傳給來賓，報名時邀請人會自動填「' + esc(m.name) + '」。</p>' +
        '<div class="link-box"><input type="text" readonly value="' + esc(url) + '"><button type="button" class="btn btn-primary" data-copy>複製連結</button></div>' +
        '<div class="qr" id="mb-qr"></div>';
      body.querySelector('[data-copy]').addEventListener('click', function () {
        App.copyText(url).then(function (ok) { App.toast(ok ? '已複製邀請連結' : '請長按連結手動複製', ok ? '' : 'error'); });
      });
      App.modal.open({ title: m.name + ' 的邀請連結', body: body });
      App.drawQr(body.querySelector('#mb-qr'), url);
    }

    App.registerPage('members', {
      title: '會員名冊',
      perm: 'members.member.view',
      render: function (el) {
        var canManage = App.can('members.member.manage');
        var noticeDays = Number(App.session.settings.expiryNoticeDays) || 0;
        var state = { members: null, filter: 'active', q: '' };
        el.innerHTML = '<div class="page-head"><div><h1>會員名冊</h1><p>會籍到期前 ' + noticeDays + ' 天開始標示提醒；也可以直接在試算表「會員名單」維護</p></div>' +
          (canManage ? '<button type="button" class="btn btn-primary" id="mb-add">＋ 新增會員</button>' : '') + '</div>' +
          '<div class="stack"><div class="filter-chips" id="mb-filter"></div><div class="toolbar">' +
          '<input type="search" id="mb-q" placeholder="搜尋姓名、公司、專業別、手機、職務"></div><div id="mb-list"></div></div>';
        var listEl = el.querySelector('#mb-list');

        function today() {
          return App.session.today || App.todayIso();
        }

        function matchesFilter(m, f) {
          if (f === 'all') return true;
          if (f === 'active') return m.active;
          if (f === 'expiring') return isExpiring(m, today(), noticeDays);
          return m.status === f || (f === '離會' && !m.active && m.status !== '休會');
        }

        function renderFilter() {
          var chips = [['active', '在籍'], ['expiring', '即將到期'], ['休會', '休會'], ['離會', '離會'], ['all', '全部']];
          el.querySelector('#mb-filter').innerHTML = chips.map(function (c) {
            var n = state.members.filter(function (m) { return matchesFilter(m, c[0]); }).length;
            return '<button type="button" data-f="' + esc(c[0]) + '"' + (state.filter === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + ' ' + n + '</button>';
          }).join('');
        }

        function render() {
          var q = state.q.toLowerCase();
          var list = state.members.filter(function (m) {
            if (!matchesFilter(m, state.filter)) return false;
            return !q || [m.name, m.company, m.category, m.phone, m.position, m.industryGroup].join(' ').toLowerCase().indexOf(q) >= 0;
          });
          if (state.filter === 'expiring') list.sort(function (a, b) { return a.expiryDate < b.expiryDate ? -1 : 1; });
          renderFilter();
          if (!list.length) {
            App.emptyState(listEl, state.members.length ? '沒有符合的會員' : '名冊還沒有資料：按「新增會員」，或匯入 PALMS 時自動加入');
            return;
          }
          listEl.innerHTML = '<div class="ev-list">' + list.map(function (m) { return memberRow(m, today(), noticeDays); }).join('') + '</div>';
        }

        function load() {
          if (!state.members) App.skeleton(listEl, 6);
          return App.api('members.list', { includeInactive: true }).then(function (res) {
            state.members = res;
            render();
          }).catch(function (err) {
            App.errorState(listEl, err);
            App.handleError(err);
          });
        }

        function groups() {
          var seen = [];
          state.members.forEach(function (m) { if (m.industryGroup && seen.indexOf(m.industryGroup) < 0) seen.push(m.industryGroup); });
          return seen.sort();
        }

        function afterChange(msg) {
          App.toast(msg);
          App.refreshSession().catch(App.handleError); // 邀請人選單等用到的會員名單
          load();
        }

        function openMember(m) {
          var url = inviteUrl(m);
          if (!canManage) {
            var rows = [['公司', m.company], ['專業別', m.category], ['產業群組', m.industryGroup], ['分會職務', m.position], ['手機', m.phone],
              ['Email', m.email], ['LINE ID', m.lineId], ['入會日', m.joinDate], ['會籍到期日', m.expiryDate], ['引薦人', m.sponsor],
              ['狀態', m.status], ['備註', m.note]];
            App.modal.open({
              title: m.name,
              body: '<ul class="list">' + rows.map(function (r) {
                return '<li><span class="muted">' + esc(r[0]) + '</span><span>' + esc(r[1] || '—') + '</span></li>';
              }).join('') + '</ul>',
              actions: [{ label: '關閉', value: null }].concat(url ? [{ label: '邀請連結', value: 'invite', cls: 'btn-primary' }] : [])
            }).then(function (v) { if (v === 'invite') showInvite(m); });
            return;
          }
          var form = memberForm(m, groups());
          var actions = [{ label: '取消', value: null }];
          if (m.id) actions.push({ label: '刪除', value: 'delete', cls: 'btn-danger' });
          if (m.id && url) actions.push({ label: '邀請連結', value: 'invite' });
          actions.push({
            label: '儲存', value: 'save', cls: 'btn-primary', primary: true, validate: function () {
              if (App.formValues(form).name) return true;
              App.toast('請填寫姓名', 'error');
              return false;
            }
          });
          App.modal.open({ title: m.id ? m.name + '（' + m.id + '）' : '新增會員', body: form, actions: actions }).then(function (v) {
            if (v === 'invite') {
              showInvite(m);
              return;
            }
            if (v === 'save') {
              var data = App.formValues(form);
              data.id = m.id || '';
              return App.api('members.save', data).then(function (saved) {
                afterChange(m.id ? '已儲存' : '已新增 ' + saved.name + '（' + saved.id + '）');
              });
            }
            if (v === 'delete') {
              return App.modal.confirm('刪除會員', '確定把「' + m.name + '」從名冊刪除？（資料仍保留在試算表；離會建議改狀態為「離會」）', '刪除').then(function (ok) {
                if (!ok) return;
                return App.api('members.delete', { id: m.id }).then(function () { afterChange('已刪除'); });
              });
            }
          }).catch(App.handleError);
        }

        el.querySelector('#mb-filter').addEventListener('click', function (e) {
          var b = e.target.closest('[data-f]');
          if (!b || !state.members) return;
          state.filter = b.getAttribute('data-f');
          render();
        });
        el.querySelector('#mb-q').addEventListener('input', function () {
          state.q = this.value.trim();
          if (state.members) render();
        });
        listEl.addEventListener('click', function (e) {
          var row = e.target.closest('.ev-row');
          if (!row || !state.members) return;
          var m = state.members.filter(function (x) { return x.id === row.getAttribute('data-id'); })[0];
          if (m) openMember(m);
        });
        if (canManage) {
          el.querySelector('#mb-add').addEventListener('click', function () {
            if (state.members) openMember({});
          });
        }
        load();
      }
    });
  })();
</script>
