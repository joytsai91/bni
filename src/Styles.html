<style>
  :root {
    --red: #cf2030;
    --red-dark: #a3172a;
    --red-soft: #fdecee;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f5f6f8;
    --card: #ffffff;
    --st-P: #15803d;
    --st-L: #c2410c;
    --st-S: #1d4ed8;
    --st-M: #7e22ce;
    --st-A: #4b5563;
    --radius: 12px;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  h1, h2, h3 { line-height: 1.3; margin: 0; }
  h2 { font-size: 18px; }
  h3 { font-size: 16px; }

  /* ---------- 版面 ---------- */
  .sticky-head { position: sticky; top: 0; z-index: 50; background: #fff; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; min-width: 0; }
  .brand-mark {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--red); color: #fff; font-weight: 900; letter-spacing: .5px;
    border-radius: 6px; padding: 2px 8px; font-size: 14px;
  }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .date-field { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .date-field input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .tabs {
    display: flex; gap: 4px; overflow-x: auto; padding: 0 12px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .tabs button {
    flex: none; border: 0; background: none; padding: 12px 14px; cursor: pointer; color: var(--muted);
    border-bottom: 3px solid transparent; font-weight: 500;
  }
  .tabs button.active { color: var(--red); border-bottom-color: var(--red); font-weight: 700; }
  .view { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card > h2 + p, .card > h2 + .muted { margin-top: 4px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 200px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; background: #fff; border: 1px dashed var(--line); border-radius: var(--radius); margin: 0; }

  /* ---------- 表單 ---------- */
  input[type=text], input[type=search], input[type=tel], input[type=email], input[type=password],
  input[type=number], input[type=date], input[type=time], input:not([type]), select, textarea {
    padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(207, 32, 48, .25); border-color: var(--red); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 14px; font-weight: 500; }
  .field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .req { color: var(--red); font-weight: 700; }
  .form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .form-error { color: var(--red); margin: 0; font-size: 14px; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff;
    cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink);
  }
  .btn:hover { background: #f9fafb; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-danger { color: var(--red); border-color: #f3b8be; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .btn-block { width: 100%; }
  .btn-link { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; text-decoration: underline; }

  /* ---------- 登入 ---------- */
  .login { display: flex; justify-content: center; padding: 64px 16px; }
  .login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- 簽到 ---------- */
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .stat b { font-weight: 700; margin-left: 4px; }
  .member-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .member-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: #fff;
    cursor: pointer; min-height: 88px; border-left-width: 5px; transition: transform .05s;
  }
  .member-card:active { transform: scale(.98); }
  .member-card .mc-name { font-size: 18px; font-weight: 700; }
  .member-card .mc-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .member-card .mc-badge { margin-top: auto; font-size: 13px; font-weight: 700; color: var(--muted); }
  .member-card.pending { opacity: .6; }
  .st-P { border-left-color: var(--st-P); } .st-P .mc-badge { color: var(--st-P); }
  .st-L { border-left-color: var(--st-L); } .st-L .mc-badge { color: var(--st-L); }
  .st-S { border-left-color: var(--st-S); } .st-S .mc-badge { color: var(--st-S); }
  .st-M { border-left-color: var(--st-M); } .st-M .mc-badge { color: var(--st-M); }
  .st-A { border-left-color: var(--st-A); background: #f3f4f6; } .st-A .mc-badge { color: var(--st-A); }
  .st-none { border-left-color: #d1d5db; }

  .guest-list { display: flex; flex-direction: column; gap: 8px; }
  .guest-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px;
  }
  .guest-row.is-in { border-left: 5px solid var(--st-P); }
  .gr-name { font-weight: 700; font-size: 16px; }
  .gr-sub { color: var(--muted); font-size: 13px; }
  .gr-actions { display: flex; gap: 8px; }
  .pill {
    border: 1px solid #d1d5db; background: #fff; border-radius: 999px; padding: 6px 14px;
    cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .pill.on { background: var(--st-P); border-color: var(--st-P); color: #fff; }
  .tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 0 6px; border-radius: 4px; background: var(--red-soft); color: var(--red); vertical-align: middle; }

  .status-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 12px 0; }
  .status-btn { padding: 12px 8px; border-radius: 10px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: 700; }
  .status-btn.st-P { color: var(--st-P); } .status-btn.st-L { color: var(--st-L); } .status-btn.st-S { color: var(--st-S); }
  .status-btn.st-M { color: var(--st-M); } .status-btn.st-A { color: var(--st-A); }
  .status-btn.current { border-color: currentColor; background: #f9fafb; }

  /* ---------- 表格 ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  table.data th { background: #f9fafb; font-weight: 700; position: sticky; top: 0; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr.alert td { background: #fff4f4; }
  table.data tr.total td { font-weight: 700; background: #f9fafb; }
  table.data tr:last-child td { border-bottom: 0; }

  /* ---------- 列印與 PALMS ---------- */
  .print-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .print-card { display: flex; flex-direction: column; gap: 10px; }
  .print-card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .print-card label { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .print-card input[type=number] { width: 80px; }
  .file-pick { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
  .notice { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .notice.warn { background: #fff4f4; border-color: #f3b8be; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .link-box { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .link-box input { flex: 1 1 260px; }
  .qr { width: 132px; height: 132px; margin-top: 8px; }
  .qr img, .qr canvas { width: 132px !important; height: 132px !important; }

  /* ---------- 對話框與提示 ---------- */
  .modal { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(17, 24, 39, .45); }
  .modal-card { background: #fff; border-radius: 14px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; padding: 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, .2); }
  .modal-card h2 { margin-bottom: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .modal textarea.copy { width: 100%; min-height: 240px; font-size: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 600;
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25); max-width: calc(100vw - 32px);
  }
  .toast.error { background: var(--red); }

  /* ---------- 來賓報名頁 ---------- */
  .register-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .register-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .register-head h1 { font-size: 22px; }
  .register-head p { margin: 0; }
  .register-form { display: flex; flex-direction: column; gap: 14px; }
  .done { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .done .big { font-size: 40px; }

  @media (max-width: 640px) {
    .topbar { padding: 8px 12px; }
    .view { padding: 12px; }
    .member-grid { grid-template-columns: repeat(2, 1fr); }
    .member-card { min-height: 80px; padding: 10px; }
  }
</style>
