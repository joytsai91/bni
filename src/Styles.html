<style>
  :root {
    --brand: #d71e2b;
    --primary: #1d4ed8;
    --primary-soft: #e8eefc;
    --link: #2563eb;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f3f4f6;
    --card: #ffffff;
    --danger: #c81e1e;
    --warn-bg: #fffbeb;
    --warn-line: #fde68a;
    --st-P: #15803d;
    --st-L: #c2410c;
    --st-S: #1d4ed8;
    --st-M: #7e22ce;
    --st-A: #4b5563;
    --radius: 16px;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --base-size: 15px;
  }
  * { box-sizing: border-box; }
  html { font-size: var(--base-size); }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font); font-size: 1rem; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  a { color: var(--link); text-decoration: none; }
  h1, h2, h3 { line-height: 1.3; margin: 0; }
  h2 { font-size: 1.15rem; }
  h3 { font-size: 1.05rem; }
  .muted { color: var(--muted); }
  .small { font-size: .87rem; }
  .brand-text { color: var(--brand); font-weight: 900; }

  /* ---------- 外框 ---------- */
  .shell { min-height: 100vh; }
  .topbar {
    position: sticky; top: 0; z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 60px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .topbar .title { font-size: 1.2rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px;
    border: 0; background: transparent; cursor: pointer; color: var(--ink);
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn svg, .nav-icon svg { width: 24px; height: 24px; }
  .content { padding: 16px 16px 96px; max-width: 1080px; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
  .page-head h1 { font-size: 1.75rem; font-weight: 900; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  /* 側邊選單（手機是抽屜，電腦固定在左邊） */
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 80; width: min(320px, 86vw); background: #fff;
    display: flex; flex-direction: column; transform: translateX(-102%); transition: transform .2s ease;
    box-shadow: 0 0 40px rgba(0, 0, 0, .2);
  }
  .drawer.open { transform: none; }
  .drawer-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(17, 24, 39, .45); }
  .drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px 16px 12px; }
  .drawer-logo {
    flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: .5px;
  }
  .drawer-head .names { flex: 1; min-width: 0; }
  .drawer-head .names b { display: block; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer-head .names span { color: var(--muted); font-size: .92rem; }
  .drawer-nav { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .nav-group { margin: 16px 8px 4px; font-size: .85rem; color: var(--muted); }
  .nav-item {
    display: flex; align-items: center; width: 100%; padding: 12px 12px; margin: 2px 0; border: 0; border-radius: 12px;
    background: transparent; cursor: pointer; font-size: 1.05rem; text-align: left;
  }
  .nav-item:hover { background: var(--bg); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .drawer-foot { border-top: 1px solid var(--line); padding: 14px 16px 18px; }
  .drawer-foot .who b { display: block; }
  .drawer-foot .who span { color: var(--muted); font-size: .87rem; }

  /* 手機底部分頁 */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; background: #fff;
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none;
    padding: 4px 0; color: var(--muted); font-size: .8rem; cursor: pointer;
  }
  .bottom-nav button.active { color: var(--primary); font-weight: 700; }
  .bottom-nav svg { width: 24px; height: 24px; }

  @media (min-width: 1024px) {
    .drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); width: 264px; }
    .drawer-overlay, .bottom-nav, #menu-btn, #drawer-close { display: none !important; }
    .shell-main { margin-left: 264px; }
    .content { padding: 24px 32px 48px; }
  }

  /* ---------- 卡片與表單 ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 12px; }
  .card-head h2 { font-size: 1.1rem; }
  .card-link { color: var(--link); font-weight: 700; border: 0; background: none; cursor: pointer; padding: 4px; }
  .card.flush { padding: 0; }
  .card.flush > .card-head { padding: 16px 18px; margin: 0; border-bottom: 1px solid var(--line); }
  .card.flush > .card-body { padding: 16px 18px; }
  .grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 200px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 24px; text-align: center; background: #fff; border: 1px dashed var(--line); border-radius: var(--radius); margin: 0; }

  input[type=text], input[type=search], input[type=tel], input[type=email], input[type=password],
  input[type=number], input[type=date], input[type=time], input[type=month], input:not([type]), select, textarea {
    padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; min-width: 0; max-width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(29, 78, 216, .25); border-color: var(--primary); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span { font-size: .93rem; font-weight: 600; }
  .field .hint { font-size: .8rem; color: var(--muted); font-weight: 400; }
  .req { color: var(--danger); font-weight: 700; }
  .form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .form-grid .full { grid-column: 1 / -1; }
  .form-error { color: var(--danger); margin: 0; font-size: .93rem; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px;
    border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-weight: 600; white-space: nowrap; color: var(--ink);
  }
  .btn:hover { background: #f9fafb; }
  .btn:disabled, .btn.is-busy { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: #1e40af; }
  .btn-outline { color: var(--link); border-color: #c7d4f5; }
  .btn-danger { color: var(--danger); border-color: #f3b8be; }
  .btn-sm { padding: 5px 10px; font-size: .87rem; }
  .btn-block { width: 100%; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-weight: 700;
  }
  .chip.aa { color: var(--link); border-color: #c7d4f5; padding: 2px 10px; border-radius: 8px; }
  .tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); vertical-align: middle; }
  .tag.red { background: #fdecee; color: var(--brand); }
  .tag.gray { background: #f3f4f6; color: var(--muted); }
  .tag.green { background: #e7f6ec; color: var(--st-P); }
  .notice { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 12px; padding: 10px 12px; font-size: .93rem; }
  .notice.warn { background: #fff4f4; border-color: #f3b8be; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .93rem; }

  /* 載入中骨架 */
  .skeleton { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .skeleton i { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, #eceef1 25%, #f6f7f8 50%, #eceef1 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  .skeleton i:nth-child(2n) { width: 70%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ---------- 首頁 ---------- */
  .hello { margin: 4px 0 18px; }
  .hello h1 { font-size: 2rem; font-weight: 900; }
  .hello p { margin: 4px 0 0; color: var(--muted); font-size: 1.05rem; }
  .hello-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .clock { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .week button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  .week .bar { height: 4px; border-radius: 4px; background: var(--line); margin-bottom: 10px; }
  .week .wd { color: var(--muted); font-size: .9rem; }
  .week .dn { font-size: 1.5rem; font-weight: 800; }
  .week .dot { display: block; width: 8px; height: 8px; border-radius: 50%; margin: 4px 0 0 2px; background: transparent; }
  .week .has .dot { background: #a16207; }
  .week .today .bar { background: var(--primary); }
  .week .today .wd, .week .today .dn { color: var(--primary); }
  .week .sel .dn { text-decoration: underline; text-underline-offset: 6px; }
  .agenda { list-style: none; margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .agenda li { font-size: 1.05rem; }
  .agenda .when { margin-right: 6px; }
  .agenda .cancelled { color: var(--muted); text-decoration: line-through; }
  .event-title { font-size: 1.35rem; font-weight: 900; }
  .event-meta { color: var(--muted); font-size: 1.05rem; margin: 4px 0 12px; }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .stat-box { flex: 1 1 90px; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat-box b { display: block; font-size: 1.35rem; }
  .stat-box span { color: var(--muted); font-size: .85rem; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }

  /* ---------- 簽到 ---------- */
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .93rem; }
  .stat b { font-weight: 800; margin-left: 4px; }
  .subtabs { display: inline-flex; background: #e5e7eb; border-radius: 12px; padding: 4px; gap: 4px; }
  .subtabs button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .subtabs button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
  .member-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .member-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px; min-height: 88px;
    border-radius: 14px; border: 1px solid var(--line); border-left-width: 5px; background: #fff; cursor: pointer;
  }
  .member-card:active { transform: scale(.98); }
  .member-card .mc-name { font-size: 1.2rem; font-weight: 800; }
  .member-card .mc-sub { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .member-card .mc-badge { margin-top: auto; font-size: .87rem; font-weight: 700; color: var(--muted); }
  .member-card.pending { opacity: .6; }
  .st-P { border-left-color: var(--st-P); } .st-P .mc-badge { color: var(--st-P); }
  .st-L { border-left-color: var(--st-L); } .st-L .mc-badge { color: var(--st-L); }
  .st-S { border-left-color: var(--st-S); } .st-S .mc-badge { color: var(--st-S); }
  .st-M { border-left-color: var(--st-M); } .st-M .mc-badge { color: var(--st-M); }
  .st-A { border-left-color: var(--st-A); background: #f3f4f6; } .st-A .mc-badge { color: var(--st-A); }
  .st-none { border-left-color: #d1d5db; }
  .guest-list { display: flex; flex-direction: column; gap: 8px; }
  .guest-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  }
  .guest-row.is-in { border-left: 5px solid var(--st-P); }
  .gr-name { font-weight: 800; font-size: 1.05rem; }
  .gr-sub { color: var(--muted); font-size: .87rem; }
  .gr-actions { display: flex; gap: 8px; }
  .pill { border: 1px solid #d1d5db; background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .93rem; font-weight: 600; white-space: nowrap; }
  .pill.on { background: var(--st-P); border-color: var(--st-P); color: #fff; }
  .status-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 12px 0; }
  .status-btn { padding: 12px 8px; border-radius: 10px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: 800; }
  .status-btn.st-P { color: var(--st-P); } .status-btn.st-L { color: var(--st-L); } .status-btn.st-S { color: var(--st-S); }
  .status-btn.st-M { color: var(--st-M); } .status-btn.st-A { color: var(--st-A); }
  .status-btn.current { border-color: currentColor; background: #f9fafb; }
  .event-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .event-picker select { flex: 1 1 260px; font-weight: 700; }

  /* ---------- 表格 ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  table.data { width: 100%; border-collapse: collapse; font-size: .93rem; }
  table.data th, table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  table.data th { background: #f9fafb; font-weight: 700; position: sticky; top: 0; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr.alert td { background: #fff4f4; }
  table.data tr.total td { font-weight: 800; background: #f9fafb; }
  table.data tr.dim td { color: var(--muted); text-decoration: line-through; }
  table.data tr:last-child td { border-bottom: 0; }

  /* ---------- 列印卡片、PALMS ---------- */
  .print-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .print-card { display: flex; flex-direction: column; gap: 10px; }
  .print-card p { margin: 0; color: var(--muted); font-size: .93rem; flex: 1; }
  .print-card label { font-size: .93rem; display: flex; align-items: center; gap: 8px; }
  .print-card input[type=number] { width: 80px; }
  .file-pick { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
  .link-box { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .link-box input { flex: 1 1 260px; }
  .qr { width: 132px; height: 132px; margin-top: 8px; }
  .qr img, .qr canvas { width: 132px !important; height: 132px !important; }

  /* ---------- 對話框、選單、提示 ---------- */
  .modal { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(17, 24, 39, .45); }
  .modal-card { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow: auto; padding: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, .2); }
  .modal-card h2 { margin-bottom: 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .modal textarea.copy { width: 100%; min-height: 240px; font-size: .93rem; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 90; min-width: 160px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); padding: 6px; }
  .menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .menu-pop button:hover { background: var(--bg); }
  .rel { position: relative; }
  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 600; background: #111827; color: #fff;
    padding: 10px 16px; border-radius: 12px; font-size: .93rem; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); max-width: calc(100vw - 32px);
  }
  .toast.error { background: var(--danger); }

  /* ---------- 登入 ---------- */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
  .login-brand { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 4px; }
  .login-brand .drawer-logo { width: 56px; height: 56px; font-size: 1.1rem; }

  /* ---------- 報名頁 ---------- */
  .register-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .register-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .register-head h1 { font-size: 1.5rem; }
  .register-head p { margin: 0; }
  .register-form { display: flex; flex-direction: column; gap: 14px; }
  .event-info { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: .93rem; }
  .segmented { display: flex; gap: 8px; }
  .segmented label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; cursor: pointer; font-weight: 700; }
  .segmented input { accent-color: var(--primary); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .done .big { font-size: 2.6rem; }

  @media (max-width: 640px) {
    .content { padding: 12px 12px 96px; }
    .hello h1 { font-size: 1.75rem; }
    .member-grid { grid-template-columns: repeat(2, 1fr); }
    .member-card { min-height: 80px; padding: 10px; }
    .card { padding: 16px; }
  }
</style>
