<script>
  /* 共用工具：API 呼叫、登入憑證、跳脫、提示、對話框、表單與載入狀態（管理系統與報名頁共用） */
  (function () {
    'use strict';
    var App = window.App = window.App || {};
    App.state = App.state || {};

    // ---------- 登入憑證：放 localStorage，重新整理或關掉分頁都不用重登（14 天後過期） ----------
    var TOKEN_KEY = 'bni_token';
    var tokenMemory = '';
    function store(key, value) {
      try {
        if (value === undefined) return window.localStorage.getItem(key) || '';
        if (value) window.localStorage.setItem(key, value);
        else window.localStorage.removeItem(key);
      } catch (e) { /* 無痕模式等環境可能無法使用 */ }
      return '';
    }
    App.store = store;
    App.getToken = function () { return tokenMemory || store(TOKEN_KEY); };
    App.setToken = function (token) { tokenMemory = token || ''; store(TOKEN_KEY, token || ''); };

    App.api = function (action, data) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.ok) return resolve(res.data);
            var err = new Error((res && res.error) || '伺服器沒有回應，請稍後再試');
            err.code = res && res.code;
            reject(err);
          })
          .withFailureHandler(function (err) {
            reject(new Error(err && err.message ? err.message : '連線失敗，請檢查網路後再試'));
          })
          .apiCall({ action: action, data: data || {}, token: App.getToken() });
      });
    };

    /** 登入後由外框設定：{ account, perms, settings, ... } */
    App.session = null;
    App.can = function (code) {
      var perms = (App.session && App.session.perms) || [];
      var codes = Array.isArray(code) ? code : [code];
      return codes.some(function (c) { return perms.indexOf(c) >= 0; });
    };

    App.$ = function (sel, root) { return (root || document).querySelector(sel); };
    App.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
    App.esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };

    var toastTimer = null;
    App.toast = function (msg, type) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.className = 'toast' + (type === 'error' ? ' error' : '');
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.hidden = true; }, type === 'error' ? 6000 : 2500);
    };

    /** 錯誤處理：登入過期就回登入畫面，其餘顯示提示 */
    App.handleError = function (err) {
      if (err && err.code === 'AUTH' && App.onAuthError) {
        App.onAuthError(err.message);
        return;
      }
      App.toast((err && err.message) || String(err), 'error');
    };

    /** 寫入用：按鈕鎖定直到完成，防止連點重複送出 */
    App.withButton = function (btn, fn) {
      if (btn && (btn.disabled || btn.classList.contains('is-busy'))) return Promise.resolve();
      if (btn) {
        btn.disabled = true;
        btn.classList.add('is-busy');
      }
      return Promise.resolve().then(fn).finally(function () {
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('is-busy');
        }
      });
    };

    // ---------- 載入狀態 ----------
    App.skeleton = function (el, lines) {
      var html = '<div class="skeleton">';
      for (var i = 0; i < (lines || 4); i++) html += '<i></i>';
      el.innerHTML = html + '</div>';
    };
    App.emptyState = function (el, msg) {
      el.innerHTML = '<p class="empty">' + App.esc(msg) + '</p>';
    };
    App.errorState = function (el, err) {
      el.innerHTML = '<p class="empty">' + App.esc((err && err.message) || '載入失敗') + '</p>';
    };

    // ---------- 表單 ----------
    App.field = function (label, control, required, hint, cls) {
      return '<label class="field' + (cls ? ' ' + cls : '') + '"><span>' + App.esc(label) + (required ? ' <b class="req">*</b>' : '') +
        '</span>' + control + (hint ? '<span class="hint">' + App.esc(hint) + '</span>' : '') + '</label>';
    };
    App.formValues = function (form) {
      var out = {};
      App.$$('[name]', form).forEach(function (el) {
        if (el.type === 'checkbox') {
          if (el.hasAttribute('data-multi')) {
            out[el.name] = out[el.name] || [];
            if (el.checked) out[el.name].push(el.value);
          } else {
            out[el.name] = el.checked;
          }
        } else if (el.type === 'radio') {
          if (el.checked) out[el.name] = el.value;
        } else {
          out[el.name] = String(el.value).trim();
        }
      });
      return out;
    };
    App.fmt = function (n) {
      return (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
    };
    App.money = function (n) {
      return 'NT$' + App.fmt(n);
    };

    // ---------- 日期 ----------
    App.WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function isoFromUtc(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    App.dateLabel = function (iso) {
      if (!iso) return '';
      return iso + '（' + App.WEEKDAYS[new Date(iso + 'T00:00:00Z').getUTCDay()] + '）';
    };
    App.shortDate = function (iso) {
      if (!iso) return '';
      return Number(iso.slice(5, 7)) + '/' + Number(iso.slice(8, 10)) + '（' + App.WEEKDAYS[new Date(iso + 'T00:00:00Z').getUTCDay()] + '）';
    };
    App.todayIso = function () {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    };
    App.addMonths = function (iso, months) {
      var d = new Date(iso + 'T00:00:00Z');
      d.setUTCMonth(d.getUTCMonth() + months);
      return isoFromUtc(d);
    };
    App.addDays = function (iso, days) {
      var d = new Date(iso + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + days);
      return isoFromUtc(d);
    };
    App.nowStamp = function () {
      var d = new Date();
      return App.todayIso() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    };
    App.greeting = function (hour) {
      return hour < 5 ? '晚安' : hour < 11 ? '早安' : hour < 18 ? '午安' : '晚安';
    };

    // ---------- 活動 ----------
    App.eventLabel = function (e) {
      return App.shortDate(e.date) + ' ' + e.name + (e.cancelled ? '（停會）' : '');
    };

    /**
     * 活動選單（簽到、活動來賓、來賓速覽、幸運轉盤共用），會記住上次選的活動。
     * onChange(event) 在載入完與切換時呼叫。
     */
    App.eventPicker = function (el, onChange) {
      el.innerHTML = '<div class="event-picker"><select aria-label="選擇活動" disabled><option>載入中…</option></select></div>';
      var select = el.querySelector('select');
      var events = [];
      var emit = function () {
        var e = events.filter(function (x) { return x.id === select.value; })[0];
        if (!e) return;
        App.state.eventId = e.id;
        onChange(e);
      };
      return App.api('events.options', {}).then(function (res) {
        events = res.events;
        if (!events.length) {
          select.innerHTML = '<option>近期沒有活動</option>';
          return null;
        }
        var chosen = events.some(function (e) { return e.id === App.state.eventId; }) ? App.state.eventId : res.defaultId;
        select.innerHTML = events.map(function (e) {
          return '<option value="' + App.esc(e.id) + '"' + (e.id === chosen ? ' selected' : '') + '>' +
            App.esc(App.eventLabel(e) + (e.date === res.today ? '・今天' : '')) + '</option>';
        }).join('');
        select.disabled = false;
        select.addEventListener('change', emit);
        emit();
        return events;
      }).catch(function (err) {
        select.innerHTML = '<option>' + App.esc(err.message) + '</option>';
        App.handleError(err);
      });
    };

    // ---------- 圖示 ----------
    var ICONS = {
      home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/>',
      guests: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
      check: '<path d="M5 12.5 10 17 19 7"/>',
      menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
      close: '<path d="M6 6l12 12M18 6 6 18"/>'
    };
    App.icon = function (name) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        (ICONS[name] || '') + '</svg>';
    };

    // ---------- 外部元件與剪貼簿 ----------
    var scripts = {};
    App.loadScript = function (src) {
      if (!scripts[src]) {
        scripts[src] = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = function () {
            delete scripts[src];
            reject(new Error('元件載入失敗，請檢查網路後再試'));
          };
          document.head.appendChild(s);
        });
      }
      return scripts[src];
    };
    App.QR_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    App.drawQr = function (el, text) {
      return App.loadScript(App.QR_URL).then(function () {
        el.innerHTML = '';
        new window.QRCode(el, { text: text, width: 264, height: 264, correctLevel: window.QRCode.CorrectLevel.M });
      }).catch(function () { /* 沒有 QR code 不影響使用 */ });
    };

    function legacyCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    App.copyText = function (text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
      }
      return Promise.resolve(legacyCopy(text));
    };

    // ---------- 對話框 ----------
    var modalResolve = null;
    function modalEl() { return document.getElementById('modal'); }
    function closeModal(value) {
      var m = modalEl();
      if (m) { m.hidden = true; m.innerHTML = ''; }
      var resolve = modalResolve;
      modalResolve = null;
      if (resolve) resolve(value);
    }

    /**
     * opts: { title, body (HTML 字串或元素), actions: [{ label, value, cls, primary, validate(), onClick(), keepOpen }] }
     * 回傳 Promise，值為按下的按鈕 value（關閉或取消為 null）。
     * body 內有 data-modal-value 的元素，點了也會以該值關閉。
     */
    App.modal = {
      open: function (opts) {
        var m = modalEl();
        if (modalResolve) closeModal(null);
        var card = document.createElement('div');
        card.className = 'modal-card';
        card.setAttribute('role', 'dialog');
        card.setAttribute('aria-modal', 'true');
        var h = document.createElement('h2');
        h.textContent = opts.title || '';
        card.appendChild(h);
        if (opts.body) {
          if (typeof opts.body === 'string') {
            var wrap = document.createElement('div');
            wrap.innerHTML = opts.body;
            card.appendChild(wrap);
          } else {
            card.appendChild(opts.body);
          }
        }
        var actions = opts.actions || [{ label: '關閉', value: null }];
        var bar = document.createElement('div');
        bar.className = 'modal-actions';
        actions.forEach(function (a) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn ' + (a.cls || '');
          b.textContent = a.label;
          b.addEventListener('click', function () {
            if (a.validate && !a.validate()) return;
            if (a.onClick) a.onClick();
            if (!a.keepOpen) closeModal(a.value === undefined ? null : a.value);
          });
          bar.appendChild(b);
          if (a.primary) card.dataset.primaryIndex = String(actions.indexOf(a));
        });
        card.appendChild(bar);
        card.addEventListener('click', function (e) {
          var t = e.target.closest('[data-modal-value]');
          if (t && card.contains(t)) closeModal(t.getAttribute('data-modal-value'));
        });
        // 表單按 Enter：執行主要按鈕，不要讓頁面重新載入
        card.addEventListener('submit', function (e) {
          e.preventDefault();
          var i = card.dataset.primaryIndex;
          if (i !== undefined) bar.children[Number(i)].click();
        });
        m.innerHTML = '';
        m.appendChild(card);
        m.hidden = false;
        var first = card.querySelector('input:not([type=hidden]):not([readonly]), select, textarea:not([readonly])');
        if (first) first.focus();
        return new Promise(function (resolve) { modalResolve = resolve; });
      },
      close: closeModal,
      confirm: function (title, message, okLabel) {
        var p = document.createElement('p');
        p.textContent = message || '';
        return App.modal.open({
          title: title,
          body: p,
          actions: [{ label: '取消', value: null }, { label: okLabel || '確定', value: 'ok', cls: 'btn-primary', primary: true }]
        }).then(function (v) { return v === 'ok'; });
      },
      /** 顯示可複製的文字（LINE 週報、出席結果） */
      showText: function (title, text) {
        var ta = document.createElement('textarea');
        ta.className = 'copy';
        ta.readOnly = true;
        ta.value = text;
        return App.modal.open({
          title: title,
          body: ta,
          actions: [
            { label: '關閉', value: null },
            {
              label: '複製', cls: 'btn-primary', keepOpen: true, onClick: function () {
                App.copyText(text).then(function (ok) {
                  if (ok) App.toast('已複製，可以貼到 LINE 了');
                  else { ta.select(); App.toast('請長按文字手動複製', 'error'); }
                });
              }
            }
          ]
        });
      }
    };

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalResolve) closeModal(null);
    });
    document.addEventListener('click', function (e) {
      if (e.target === modalEl()) closeModal(null);
    });
  })();
</script>
